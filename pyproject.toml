[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "net-map"
version = "0.1.0"
description = "Herramienta open source para descubrimiento de redes y auditoría de seguridad."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
    { name = "Falconmx1" },
]
keywords = [
    "network-discovery",
    "security-audit",
    "network-scanning",
    "raw-packets",
    "inventory",
    "uptime",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "scapy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
netmap = "src.cli.main:main"
netmap-gui = "src.gui.app:run"

[project.urls]
Homepage = "https://github.com/Falconmx1/Net-Map"
Repository = "https://github.com/Falconmx1/Net-Map"
Issues = "https://github.com/Falconmx1/Net-Map/issues"

[tool.setuptools]
packages = [
    "src",
    "src.cli",
    "src.core",
    "src.packets",
    "src.diff",
    "src.transfer",
    "src.inventory",
    "src.gui",
]

[tool.setuptools.package-data]
"*" = ["*.json"]
